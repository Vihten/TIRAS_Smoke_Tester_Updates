name: Publish OTA release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-ota-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release assets
        uses: actions/checkout@v4

      - name: Validate and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          manifest_release_tag="$(jq -r '.release.tag // .tag' ota-manifest.json)"
          release_name="$(jq -r '.release.name // .releaseName' ota-manifest.json)"
          release_notes="$(jq -r '.notes' ota-manifest.json)"
          asset_dir="release-assets/${release_tag}"
          checksums="${asset_dir}/SHA256SUMS.txt"

          test "${manifest_release_tag}" = "${release_tag}"
          test -s "${checksums}"

          mapfile -t components < <(
            jq -r '.release.components[]?' ota-manifest.json
          )
          if [[ "${#components[@]}" -eq 0 ]]; then
            components=(smokeTester twinButton twinBootloader)
          fi

          assets=("${checksums}")
          for component in "${components[@]}"; do
            case "${component}" in
              smokeTester)
                asset_name="$(jq -r '.smokeTester.assetName // .assetName' ota-manifest.json)"
                ;;
              twinButton)
                twin_bin="$(jq -r '.twinButton.bin.assetName' ota-manifest.json)"
                twin_dat="$(jq -r '.twinButton.dat.assetName' ota-manifest.json)"
                twin_combined="$(jq -r '.twinButton.combinedSmokeBin.assetName // empty' ota-manifest.json)"
                test -s "${asset_dir}/${twin_bin}"
                test -s "${asset_dir}/${twin_dat}"
                assets+=("${asset_dir}/${twin_bin}" "${asset_dir}/${twin_dat}")
                if [[ -n "${twin_combined}" ]]; then
                  test -s "${asset_dir}/${twin_combined}"
                  assets+=("${asset_dir}/${twin_combined}")
                fi
                continue
                ;;
              twinBootloader)
                asset_name="$(jq -r '.twinButton.bootloader.assetName' ota-manifest.json)"
                ;;
              *)
                echo "Unknown release component: ${component}" >&2
                exit 1
                ;;
            esac
            test -s "${asset_dir}/${asset_name}"
            assets+=("${asset_dir}/${asset_name}")
          done

          (
            cd "${asset_dir}"
            sha256sum --check "SHA256SUMS.txt"
          )

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --latest \
              --title "${release_name}" \
              --notes "${release_notes}"
          else
            gh release create "${release_tag}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --latest \
              --title "${release_name}" \
              --notes "${release_notes}"
          fi
